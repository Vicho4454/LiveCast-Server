name: Wails Build Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup MSYS2 (MinGW64) and FFmpeg
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-pkgconf

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Windows App
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin:$(pwd)/third_party/ndi/Lib/x64
          wails build -platform windows/amd64
          
          # Copiar todas las DLLs necesarias a la carpeta final para que la app funcione
          cp third_party/ndi/Lib/x64/Processing.NDI.Lib.x64.dll build/bin/
          cp /mingw64/bin/avcodec-*.dll build/bin/
          cp /mingw64/bin/avutil-*.dll build/bin/
          cp /mingw64/bin/swscale-*.dll build/bin/
          cp /mingw64/bin/swresample-*.dll build/bin/ || true
          cp /mingw64/bin/libgcc_s_seh-*.dll build/bin/ || true
          cp /mingw64/bin/libstdc++-*.dll build/bin/ || true
          cp /mingw64/bin/libwinpthread-*.dll build/bin/ || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveCast-Server-Windows-EXE
          path: build/bin/
