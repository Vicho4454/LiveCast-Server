<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveCast OBS Plugin</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.2.47/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/obs-websocket-js@5.0.2/dist/obs-ws.js"></script>
  <style>
    :root {
      --bg: #2b2b2b;
      --bg-panel: #3c3c3c;
      --text: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #10b981;
      --danger: #ef4444;
    }
    body {
      margin: 0;
      padding: 12px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      border-bottom: 1px solid #555;
      padding-bottom: 8px;
    }
    .card {
      background: var(--bg-panel);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }
    input {
      background: #1e1e1e;
      border: 1px solid #555;
      color: white;
      padding: 6px 8px;
      border-radius: 4px;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    button:hover { background: var(--primary-hover); }
    button.success { background: var(--success); }
    .camera-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #555;
    }
    .camera-item:last-child { border-bottom: none; }
    .status {
      font-size: 12px;
      color: #aaa;
    }
    .badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 4px;
    }
    .badge.green { background: var(--success); }
    .badge.red { background: var(--danger); }
  </style>
</head>
<body>
  <div id="app">
    <div class="card" v-if="!obsConnected">
      <h2>Conectar a OBS</h2>
      <p style="font-size: 12px; color: #ccc;">Asegúrate de tener el servidor WebSocket habilitado en OBS.</p>
      <div class="input-group">
        <label>Contraseña WebSocket (si aplica)</label>
        <input type="password" v-model="obsPassword" placeholder="Contraseña...">
      </div>
      <button @click="connectOBS" style="width: 100%;">Conectar Plugin</button>
      <p v-if="error" style="color: var(--danger); font-size: 12px; margin-top: 8px;">{{ error }}</p>
    </div>

    <div v-else>
      <div class="card">
        <h2 style="display: flex; justify-content: space-between;">
          <span>Cámaras LiveCast</span>
          <span style="color: var(--success); font-size: 12px;">✅ En línea</span>
        </h2>
        
        <div v-if="cameras.length === 0" style="text-align: center; color: #888; padding: 10px 0;">
          No hay cámaras transmitiendo.
        </div>
        
        <div class="camera-item" v-for="cam in cameras" :key="cam.id">
          <div>
            <div style="font-weight: bold;">{{ cam.ndiName || cam.id }}</div>
            <div class="status"><span class="badge green"></span> {{ cam.batteryLevel }}% Batería</div>
          </div>
          <button @click="addSource(cam)">+ Añadir</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, onMounted, onUnmounted } = Vue;

    createApp({
      setup() {
        const obs = new OBSWebSocket();
        const obsConnected = ref(false);
        const obsPassword = ref(localStorage.getItem('lc_obs_pwd') || '');
        const error = ref('');
        const cameras = ref([]);
        let interval = null;

        // Auto-connect si no hay contraseña (algunos OBS 28+ vienen sin pass por defecto o ya lo guardaron)
        onMounted(() => {
          if (!obsPassword.value) {
            connectOBS(); // Intento inicial silencioso
          }
        });

        onUnmounted(() => {
          if (interval) clearInterval(interval);
          obs.disconnect();
        });

        const connectOBS = async () => {
          try {
            error.value = '';
            await obs.connect('ws://127.0.0.1:4455', obsPassword.value);
            obsConnected.value = true;
            localStorage.setItem('lc_obs_pwd', obsPassword.value);
            
            // Iniciar polling del servidor de origen (donde se hospeda este HTML)
            fetchCameras();
            interval = setInterval(fetchCameras, 2000);
          } catch (e) {
            error.value = 'Fallo al conectar a OBS: ' + e.message;
            obsConnected.value = false;
          }
        };

        const fetchCameras = async () => {
          try {
            // Se asume que este HTML se está sirviendo desde el PC1
            const serverHost = window.location.origin; 
            const res = await fetch(`${serverHost}/api/status`);
            if (res.ok) {
              const data = await res.json();
              cameras.value = data.sessions || [];
            }
          } catch (e) {
            console.error('Error fetching cameras from LiveCast Server:', e);
          }
        };

        const addSource = async (cam) => {
          const sourceName = `LiveCast - ${cam.ndiName || cam.id}`;
          const serverHost = window.location.hostname;
          const rtspUrl = `rtsp://${serverHost}:8554/${cam.id}`;
          
          try {
            // Obtener la escena actual primero
            const { currentProgramSceneName } = await obs.call('GetCurrentProgramScene');
            
            await obs.call('CreateInput', {
              sceneName: currentProgramSceneName,
              inputName: sourceName,
              inputKind: 'ffmpeg_source',
              inputSettings: {
                input: rtspUrl,
                hw_decode: true,
                clear_on_media_end: false,
                network_caching: 100 // 100ms buffering para ultra baja latencia
              }
            });
            alert('¡Cámara inyectada en OBS exitosamente!');
          } catch (e) {
            if (e.message.includes('already exists')) {
              alert('La cámara ya existe en OBS.');
            } else {
              alert('Error inyectando fuente: ' + e.message);
            }
          }
        };

        return {
          obsConnected,
          obsPassword,
          error,
          cameras,
          connectOBS,
          addSource
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
